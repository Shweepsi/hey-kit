name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntaxe
        run: for f in kit.mjs src/*.mjs public/app.js test/*.mjs; do node --check "$f"; done
      - name: Tests
        run: npm test
